# Spring Boot application configuration

# Server port — 8080 is the standard REST API port
server.port=8080

# Application name (shows up in logs and Actuator info)
spring.application.name=calculator-api

# Actuator: expose health endpoint (needed for Docker health checks)
# "health" is the minimum; we also expose "info" for completeness
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Custom app info (shows up in /actuator/info)
info.app.name=Calculator REST API
info.app.description=SPE Mini-Project CI/CD Calculator
info.app.version=1.0.0
