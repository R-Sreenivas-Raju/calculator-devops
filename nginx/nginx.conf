# ─────────────────────────────────────────────────────────────────────────────
# Nginx Configuration — Reverse Proxy for Calculator API
#
# Role: Acts as a reverse proxy in front of the Spring Boot Calculator API.
# All public traffic hits Nginx on port 80, which forwards to calculator:8080.
# ─────────────────────────────────────────────────────────────────────────────

events {
    # Maximum number of simultaneous connections per worker process
    worker_connections 1024;
}

http {
    # ── Logging ───────────────────────────────────────────────────────────────
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # ── Upstream: the Calculator service ─────────────────────────────────────
    # "calculator" is the Docker Compose service name — Docker DNS resolves it
    upstream calculator_backend {
        server calculator:8080;
    }

    # ── Server block: listen on port 80 ──────────────────────────────────────
    server {
        listen 80;
        server_name localhost;

        # ── Proxy all /api/v1/* requests to the calculator backend ─────────
        location /api/ {
            proxy_pass         http://calculator_backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Timeout settings
            proxy_connect_timeout 10s;
            proxy_read_timeout    60s;
        }

        # ── Proxy /actuator/* (health checks) to the calculator backend ────
        location /actuator/ {
            proxy_pass         http://calculator_backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
        }

        # ── Nginx health endpoint (for Docker healthcheck of Nginx itself) ─
        location /health {
            return 200 'Nginx OK\n';
            add_header Content-Type text/plain;
        }

        # ── Root — show a simple info message ─────────────────────────────
        location / {
            return 200 'SPE Mini-Project: Calculator API\nUse /api/v1/add?a=2&b=3\n';
            add_header Content-Type text/plain;
        }
    }
}
